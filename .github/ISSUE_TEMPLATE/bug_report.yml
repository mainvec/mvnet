name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: input
    id: version
    attributes:
      label: mvnet version
      description: The release tag or commit where the problem occurs.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: go1.24.3 darwin/arm64
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package
      placeholder: github.com/mainvec/mvnet/stun
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce the issue.
    validations:
      required: true